# How to reach the cluster, and what an hour on it costs.
# Per-machine overrides do not belong here — see templates/envrc.example.
login_host: tillicum-login
node_config_path: ~/.ssh/tillicum-node-config
default_qos: interactive
gpu_usd_per_hour: 0.90

# Launch records, status blocks and agent logs live here, on the CLUSTER. Never inside a
# staged repo: stage() refuses a dirty tree, and that refusal is what stops an experiment
# silently measuring unreviewed code.
run_root: ~/.slurm-agent/runs

# How an allocation is held so it outlives the ssh that asked for it.
#
#   tmux      (default) a named, detached session on the login node holds the salloc.
#             Chosen for OBSERVABILITY, not just compatibility: `ssh tillicum-login` then
#             `tmux ls` shows every allocation this repo started, and you can attach to the
#             shell that spawned one. `salloc --no-shell` leaves nothing to attach to, so a
#             stuck allocation is only a job id.
#   no_shell  `salloc --no-shell`. Nothing to attach to, but no tmux dependency either.
#
# `poe healthcheck` checks tmux is present on the login node whenever this is `tmux`.
allocation_mode: tmux
