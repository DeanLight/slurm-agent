# Where messages go. NO secrets here and no path to any — values live in .envrc.
#
# This list is also what decides which keys `poe hc` demands: a channel here must work, so
# its keys must be set. Slack is OFF by default for exactly that reason — optional means
# you opt in, not that it is half-configured and forgiven. Add `slack` and its webhook
# becomes required, which is the point: a channel that is on but cannot send is worse than
# one that is off, because you only find out when nothing arrives.
channels: [email]

# Who gets the email. The digest, supervision escalations and the agents all use this.
to: deanlcs@cs.washington.edu

# Optional Slack channel override; the incoming webhook already has a default.
slack_channel: null
