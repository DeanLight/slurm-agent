[project]
name = "slurm-agent"
version = "0.1.0"
description = ""
authors = [{name = "Dean Light"}]
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=2.0.0",
    "jinja2>=3.1",
    "juplit>=0.1.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "structlog>=24.1",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "juplit>=0.1.0",
    "poethepoet>=0.25.0",
    "ipykernel>=6.0.0",
    "pre-commit>=3.0.0",
    "pytest>=8.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-jupyter>=0.24.0",
    "mkdocstrings[python]>=0.24.0",
]

[tool.poe]
# Every task gets the secrets from .envrc. Verified to accept `export KEY=v`, bare
# `KEY=v` and comments — which is why this repo needs no direnv dependency.
envfile = ".envrc"

[tool.poe.tasks]
# ── notebook plumbing (from the juplit template) ────────────────────────────────
hooks        = {cmd = "pre-commit install", help = "Install git hooks"}
sync         = {cmd = "juplit sync", help = "Sync .py<->ipynb for all paired notebooks"}
nb           = {cmd = "juplit nb",   help = "Generate .ipynb from .py files (run after cloning)"}
clean        = {cmd = "juplit clean",help = "Sync then delete all .ipynb files"}
test         = {cmd = "pytest",      help = "Run tests"}
check        = {cmd = "juplit check", help = "Fail if a committed notebook's outputs contradict its .py"}
html         = {cmd = "juplit html",  help = "Render a notebook to standalone HTML"}
# Claude Code discovers project skills as `.claude/skills/<name>/SKILL.md` — a DIRECTORY
# each. A flat `.claude/skills/<name>.md` is silently never loaded, which looks exactly
# like a skill that exists and is being ignored.
skill        = {shell = "mkdir -p .claude/skills/juplit-programming && juplit skill > .claude/skills/juplit-programming/SKILL.md && echo 'wrote .claude/skills/juplit-programming/SKILL.md'", help = "Install/refresh the juplit skill for Claude Code"}
docs         = {cmd = "mkdocs serve", help = "Serve docs locally for preview"}
docs-build   = {cmd = "mkdocs build", help = "Build docs site"}
docs-deploy  = {cmd = "mkdocs gh-deploy --force", help = "Deploy docs to GitHub Pages"}

# ── the manager session ─────────────────────────────────────────────────────────
# Starts the manager with Remote Control on and the previous conversation resumed.
#
# This task configures NOTHING. `CLAUDE.md`, the skill, `.mcp.json` and
# `.claude/settings.json` are what make a session in this directory the manager, and a bare
# `claude` here is still exactly that — which is the property that stopped the last wrapper
# from being worth keeping. What this adds is the two things that live on the command line
# and cannot be checked in: the Remote Control name, and resume.
#
# Resume is not implied by `--remote-control`. That flag starts an interactive session with
# Remote Control enabled and optionally names the remote link; the name is not a
# conversation identity, so typing the same one tomorrow gives you a second, empty
# conversation next to yesterday's. `--continue` is what resumes, and it fails outright when
# there is nothing to continue — hence the check rather than the flag on its own.
#
# The transcript directory is Claude Code's, addressed by its own slugged-path convention.
# If that guess ever misses, the fallback is a fresh session: a lost resume, never a failed
# launch.
claude-manage = {shell = """
name="${SLURM_AGENT_MANAGER_SESSION:-Tillicum manager}"
transcripts="$HOME/.claude/projects/$(pwd | sed 's|/|-|g')"
if [ -n "${SLURM_AGENT_MANAGER_FRESH:-}" ]; then
  echo "starting a fresh manager conversation (SLURM_AGENT_MANAGER_FRESH set)" >&2
  exec claude --remote-control "$name"
elif ls "$transcripts"/*.jsonl >/dev/null 2>&1; then
  echo "resuming the most recent manager conversation in this directory" >&2
  exec claude --continue --remote-control "$name"
else
  echo "no previous conversation here — starting a fresh one" >&2
  exec claude --remote-control "$name"
fi
""", help = "Start (or resume) the manager session, with Remote Control on"}
manage       = {ref = "claude-manage", help = "Alias for claude-manage"}

# ── setup ───────────────────────────────────────────────────────────────────────
init         = {cmd = "slurm-agent init", help = "Create the local footprint, then run a full healthcheck"}
healthcheck  = {cmd = "slurm-agent healthcheck", help = "Is everything wired and working? Fast by default"}
hc           = {ref = "healthcheck", help = "Alias for healthcheck — quick to run after moving network"}

# ── allocations ─────────────────────────────────────────────────────────────────
job-up       = {cmd = "slurm-agent job-up", help = "Bring up an allocation, or reattach to one"}
job-status   = {cmd = "slurm-agent job-status", help = "Every allocation of mine, one line each"}
job-shell    = {cmd = "slurm-agent job-shell", help = "Shell on the allocation's compute node"}
job-down     = {cmd = "slurm-agent job-down", help = "Cancel the allocation"}

# ── remote agents ───────────────────────────────────────────────────────────────
agent-run      = {cmd = "slurm-agent agent-run", help = "Stage a repo and launch an agent on an allocation"}
agent-batch    = {cmd = "slurm-agent agent-batch", help = "Submit an agent as a self-terminating sbatch job"}
agent-status   = {cmd = "slurm-agent agent-status", help = "One line per live remote agent"}
agent-logs     = {cmd = "slurm-agent agent-logs", help = "Read a remote notebook or log in place"}
agent-watch    = {cmd = "slurm-agent agent-watch", help = "The supervision loop: poll, decide, act, log"}
agent-kill     = {cmd = "slurm-agent agent-kill", help = "Stop one agent, recording the reason"}
agent-continue = {cmd = "slurm-agent agent-continue", help = "A fresh lease on the same notebook"}

# ── polling and tidying ─────────────────────────────────────────────────────────
status       = {cmd = "slurm-agent status", help = "What is running, queued, completed and failed"}
flush        = {cmd = "slurm-agent flush", help = "Drop finished runs from status"}

# ── notifications and usage ─────────────────────────────────────────────────────
spend             = {cmd = "slurm-agent spend", help = "What the scheduled polls recorded about cost"}
monitor-run       = {cmd = "slurm-agent monitor-run", help = "Poll usage; record only if spend moved"}
monitor-install   = {cmd = "slurm-agent monitor-install", help = "Install the digest schedule here"}
monitor-uninstall = {cmd = "slurm-agent monitor-uninstall", help = "Remove the digest schedule"}
monitor-status    = {cmd = "slurm-agent monitor-status", help = "Is the schedule on, and when does it fire"}
session-new       = {cmd = "slurm-agent session-new", help = "Scaffold a session artifact notebook"}


[tool.juplit]
notebook_src_dirs = ["slurm_agent", "docs"]

# Pairs whose .ipynb is committed WITH its outputs, because the outputs are the
# deliverable (experiment notebooks). Their outputs survive nb / sync / clean, and
# `juplit check` fails if they stop matching the .py that produced them.
# Remember to un-ignore each one in .gitignore — see the comment there.
# A session's record belongs in the repo the agents worked on, alongside the experiment it
# is about, so no session notebook is listed here. The quick start is the one exception and
# a different kind of thing: it is not a record of an experiment, it is the setup procedure
# for this repo, and its outputs are what tell you a fresh clone actually works.
artifact_notebooks = ["docs/quickstart.py"]

[tool.jupytext]
formats = "ipynb,py:percent"

[project.scripts]
slurm-agent = "slurm_agent.cli:main"

[tool.pytest.ini_options]
# Explicit, because `if test():` blocks run at IMPORT during collection: if a directory is
# not collected its tests silently do not run, which looks identical to passing.
testpaths = ["slurm_agent", "tests"]
# Shipped assets run on the cluster under whatever python is there; never import them here.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv",
                 "{arch}", "assets"]
# Shipped assets are copied to the cluster and run there; they are not our test modules.
python_files = ["*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
